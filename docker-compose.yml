version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shiftflow-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://shiftflow:ShiftFlowSecret2026@postgres:5432/shiftflow_db?schema=public
      - JWT_SECRET=shiftflow-super-secure-production-jwt-token-key-2026
      - JWT_EXPIRES_IN=7d
      - COOKIE_SECRET=shiftflow-super-secure-cookie-secret-2026
      - CLIENT_URL=http://localhost:5000
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: shiftflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: shiftflow
      POSTGRES_PASSWORD: ShiftFlowSecret2026
      POSTGRES_DB: shiftflow_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftflow -d shiftflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local

