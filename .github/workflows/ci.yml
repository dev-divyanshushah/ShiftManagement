name: ShiftFlow Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup environment variables
        run: cp .env.example .env

      - name: Generate Prisma Client & Push Database Schema
        run: |
          npx prisma generate
          npx prisma db push
          node prisma/seed.js

      - name: Run Test Suite (Unit & Integration Tests)
        run: npm test

      - name: Build Frontend Application Bundle
        run: npm run build

      - name: Verify Health Check Output
        run: node -e "console.log('CI verification succeeded.')"

